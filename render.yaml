services:
  - type: web
    name: david-pere-review
    runtime: static
    buildCommand: "echo Static website ready"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
